<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Chess Game</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-900 text-white">
  <div id="root"></div>
  <script type="text/babel">
    const { motion } = framerMotion;

    const Navbar = () => (
      <nav className="fixed top-0 left-0 right-0 bg-gray-800/50 backdrop-blur-md p-4 z-50">
        <div className="container mx-auto flex justify-between items-center">
          <h1 className="text-2xl font-bold text-primary">ChessMaster</h1>
          <div className="flex space-x-4">
            <a href="#features" className="hover:text-primary transition-colors">Features</a>
            <a href="#testimonials" className="hover:text-primary transition-colors">Testimonials</a>
            <a href="#pricing" className="hover:text-primary transition-colors">Pricing</a>
            <a href="#contact" className="hover:text-primary transition-colors">Contact</a>
          </div>
        </div>
      </nav>
    );

    const Hero = () => (
      <motion.section 
        initial={{ opacity: 0, y: 20 }}
        animate={{ opacity: 1, y: 0 }}
        transition={{ duration: 0.5 }}
        className="min-h-screen flex flex-col justify-center items-center text-center p-4"
      >
        <h2 className="text-5xl font-bold mb-4">Master Chess Like Never Before</h2>
        <p className="text-gray-400 mb-8">Experience the ultimate chess platform with AI opponents, multiplayer, and advanced analytics.</p>
        <button className="bg-primary px-6 py-3 rounded-lg font-semibold hover:bg-primary/90 transition-colors">Get Started</button>
      </motion.section>
    );

    const Features = () => (
      <section id="features" className="py-20">
        <div className="container mx-auto">
          <h2 className="text-3xl font-bold text-center mb-12">Features</h2>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div className="bg-gray-800 p-6 rounded-lg">
              <h3 className="text-xl font-semibold mb-4">AI Opponents</h3>
              <p className="text-gray-400">Challenge AI opponents with varying difficulty levels.</p>
            </div>
            <div className="bg-gray-800 p-6 rounded-lg">
              <h3 className="text-xl font-semibold mb-4">Multiplayer</h3>
              <p className="text-gray-400">Play against friends or random opponents online.</p>
            </div>
            <div className="bg-gray-800 p-6 rounded-lg">
              <h3 className="text-xl font-semibold mb-4">Game Analysis</h3>
              <p className="text-gray-400">Analyze your games with advanced tools and statistics.</p>
            </div>
          </div>
        </div>
      </section>
    );

    const Testimonials = () => (
      <section id="testimonials" className="py-20 bg-gray-800">
        <div className="container mx-auto">
          <h2 className="text-3xl font-bold text-center mb-12">Testimonials</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="bg-gray-900 p-6 rounded-lg">
              <p className="text-gray-400 mb-4">"ChessMaster has completely transformed my game. The AI opponents are incredibly challenging!"</p>
              <p className="font-semibold">- John Doe</p>
            </div>
            <div className="bg-gray-900 p-6 rounded-lg">
              <p className="text-gray-400 mb-4">"The multiplayer feature is seamless and the game analysis tools are top-notch."</p>
              <p className="font-semibold">- Jane Smith</p>
            </div>
          </div>
        </div>
      </section>
    );

    const Pricing = () => (
      <section id="pricing" className="py-20">
        <div className="container mx-auto">
          <h2 className="text-3xl font-bold text-center mb-12">Pricing</h2>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div className="bg-gray-800 p-6 rounded-lg">
              <h3 className="text-xl font-semibold mb-4">Basic</h3>
              <p className="text-gray-400 mb-4">Free</p>
              <ul className="text-gray-400">
                <li>AI Opponents</li>
                <li>Multiplayer</li>
              </ul>
            </div>
            <div className="bg-gray-800 p-6 rounded-lg">
              <h3 className="text-xl font-semibold mb-4">Pro</h3>
              <p className="text-gray-400 mb-4">$9.99/month</p>
              <ul className="text-gray-400">
                <li>Advanced AI Opponents</li>
                <li>Game Analysis</li>
              </ul>
            </div>
            <div className="bg-gray-800 p-6 rounded-lg">
              <h3 className="text-xl font-semibold mb-4">Premium</h3>
              <p className="text-gray-400 mb-4">$19.99/month</p>
              <ul className="text-gray-400">
                <li>All Pro Features</li>
                <li>Priority Support</li>
              </ul>
            </div>
          </div>
        </div>
      </section>
    );

    const Contact = () => (
      <section id="contact" className="py-20 bg-gray-800">
        <div className="container mx-auto">
          <h2 className="text-3xl font-bold text-center mb-12">Contact Us</h2>
          <form className="max-w-lg mx-auto">
            <div className="mb-4">
              <label className="block text-gray-400 mb-2">Name</label>
              <input type="text" className="w-full bg-gray-900 p-2 rounded-lg" />
            </div>
            <div className="mb-4">
              <label className="block text-gray-400 mb-2">Email</label>
              <input type="email" className="w-full bg-gray-900 p-2 rounded-lg" />
            </div>
            <div className="mb-4">
              <label className="block text-gray-400 mb-2">Message</label>
              <textarea className="w-full bg-gray-900 p-2 rounded-lg"></textarea>
            </div>
            <button type="submit" className="bg-primary px-6 py-3 rounded-lg font-semibold hover:bg-primary/90 transition-colors">Send Message</button>
          </form>
        </div>
      </section>
    );

    const Footer = () => (
      <footer className="py-8 bg-gray-900">
        <div className="container mx-auto text-center">
          <p className="text-gray-400">© 2024 ChessMaster. All rights reserved.</p>
        </div>
      </footer>
    );

    const App = () => (
      <>
        <Navbar />
        <Hero />
        <Features />
        <Testimonials />
        <Pricing />
        <Contact />
        <Footer />
      </>
    );

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
