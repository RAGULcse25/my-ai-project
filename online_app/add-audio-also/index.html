<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CryptoVault</title>
    <script>
        // Load theme immediately to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-primary: #fff;
            --text-secondary: #ccc;
            --text-muted: #aaa;
            --bg-card: #2f2f2f;
            --bg-card-hover: #3f3f3f;
            --border: #444;
            --accent-copper: #ff9900;
            --accent-gradie: #ff9900;
            --accent-gradient: linear-gradient(45deg, #ff9900, #ffcc00);
        }
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #1a1a1a;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .header-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header-search {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-card);
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: border-color 0.2s ease;
        }
        .header-search:focus-within {
            border-color: var(--accent-copper);
        }
        .header-search svg {
            color: var(--text-muted);
        }
        .header-search input {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            width: 180px;
            font-family: inherit;
        }
        .header-search input::placeholder {
            color: var(--text-muted);
        }
        .header-search input:focus {
            outline: none;
        }
        .notification-btn {
            position: relative;
            width: 44px;
            height: 44px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }
        .notification-btn:hover {
            background-color: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 20px;
            height: 20px;
            background: var(--accent-gradie);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 12px;
        }
        .auth-branding {
            flex: 1;
            background: var(--accent-gradient);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }
        .auth-branding::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 70%, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: float 15s ease-in-out infinite;
        }
        .auth-branding::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -30%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 30%, transparent 0%, rgba(255,255,255,0.1) 50%);
            animation: float 15s ease-in-out infinite;
            animation-delay: 2.5s;
        }
        @keyframes float {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
            100% {
                transform: translateY(0);
            }
        }
        .audio-player {
            width: 100%;
            height: 50px;
            background-color: var(--bg-card);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .audio-player audio {
            width: 100%;
            height: 30px;
        }
        .audio-player button {
            width: 30px;
            height: 30px;
            background-color: var(--bg-card);
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }
        .audio-player button:hover {
            background-color: var(--bg-card-hover);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>CryptoVault</h1>
        <div class="header-right">
            <div class="header-search">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                </svg>
                <input type="search" placeholder="Search">
            </div>
            <button class="notification-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-bell" viewBox="0 0 16 16">
                    <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2z"/>
                    <path d="M8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.082 1.276-.29 1.788L8 13.908l3.293-5.707c.289-.529.289-1.159 0-1.788a4.002 4.002 0 0 0-3.518-3.084z"/>
                </svg>
                <span class="notification-badge">5</span>
            </button>
        </div>
    </header>
    <main>
        <section class="auth-branding">
            <h1>CryptoVault</h1>
            <p>Welcome to CryptoVault, your secure cryptocurrency wallet.</p>
            <img src="https://picsum.photos/seed/crypto/200/300" alt="Crypto Image">
            <div class="audio-player">
                <audio controls>
                    <source src="https://example.com/audio.mp3" type="audio/mp3">
                </audio>
                <button>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-play" viewBox="0 0 16 16">
                        <path d="M10.804 8C10.235 7.171 9.135 6.67 7.804 6.67c-1.63 0-3.07.57-4.086 1.634-.98.74-1.464 1.94-1.464 3.22 0 1.282.486 2.479 1.464 3.22A7.874 7.874 0 0 1 5 8c0-1.234.218-2.317.794-3.22C7.138 4.11 8.806 3.51 10.804 3.51s3.07.57 4.086 1.634c.98.74 1.464 1.94 1.464 3.22 0 1.282-.486 2.479-1.464 3.22-.74.98-1.94 1.464-3.22 1.464-.746 0-1.436-.23-2.034-.57v.052l-.013.014a.696.696 0 0 1-.023.018C10.294 15.096 10.235 15 10.176 15H6.5a.5.5 0 0 1 0-1h4.176C10.235 14 10.294 13.904 10.804 13.5v-.102c.005-.007.012-.014.023-.018l.013-.014v-.052c.598-.337 1.288-.928 1.803-1.803.515-.875.803-1.964.803-3.22 0-1.282-.287-2.317-.803-3.22-.516-.875-1.205-1.464-1.803-1.803z"/>
                    </svg>
                </button>
            </div>
        </section>
    </main>
    <script>
        const themeSwitch = document.querySelector('.theme-switch');
        const theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        themeSwitch.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
