<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.2.4/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/lucide@1.7.0/dist/lucide.min.css" rel="stylesheet">
</head>
<body class="dark bg-gray-900 text-gray-200 h-screen">
    <div class="max-w-xs mx-auto p-4">
        <div id="home" class="block">
            <h1 class="text-3xl font-bold mb-4">Scientific Calculator</h1>
            <form id="calc-form">
                <input type="text" id="calc-input" class="w-full p-2 mb-2 border border-gray-600 rounded" placeholder="Enter calculation">
                <button type="button" id="calc-btn" class="w-full p-2 mb-2 bg-blue-600 hover:bg-blue-700 text-white rounded">Calculate</button>
                <div id="calc-result" class="p-2 mb-2 border border-gray-600 rounded"></div>
            </form>
            <button type="button" id="history-btn" class="w-full p-2 mb-2 bg-blue-600 hover:bg-blue-700 text-white rounded">View History</button>
        </div>
        <div id="history" class="hidden">
            <h1 class="text-3xl font-bold mb-4">Calculation History</h1>
            <ul id="history-list" class="list-none p-0 m-0">
                <!-- History items will be appended here -->
            </ul>
            <button type="button" id="back-btn" class="w-full p-2 mb-2 bg-blue-600 hover:bg-blue-700 text-white rounded">Back to Calculator</button>
        </div>
    </div>
    <nav class="fixed bottom-0 w-full max-w-xs mx-auto p-2 bg-gray-800 text-gray-200 flex justify-between">
        <button type="button" id="home-nav" class="p-2 hover:bg-gray-700 rounded">
            <i class="lucide lucide-home"></i>
        </button>
        <button type="button" id="history-nav" class="p-2 hover:bg-gray-700 rounded">
            <i class="lucide lucide-clock"></i>
        </button>
    </nav>

    <script>
        // Get elements
        const calcForm = document.getElementById('calc-form');
        const calcInput = document.getElementById('calc-input');
        const calcBtn = document.getElementById('calc-btn');
        const calcResult = document.getElementById('calc-result');
        const historyBtn = document.getElementById('history-btn');
        const historyList = document.getElementById('history-list');
        const backBtn = document.getElementById('back-btn');
        const homeNav = document.getElementById('home-nav');
        const historyNav = document.getElementById('history-nav');
        const homeSection = document.getElementById('home');
        const historySection = document.getElementById('history');

        // Add event listeners
        calcBtn.addEventListener('click', calculate);
        historyBtn.addEventListener('click', showHistory);
        backBtn.addEventListener('click', showHome);
        homeNav.addEventListener('click', showHome);
        historyNav.addEventListener('click', showHistory);

        // Calculate function
        function calculate() {
            const calculation = calcInput.value;
            // Send calculation to Flask API
            fetch('/calculate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ calculation: calculation })
            })
            .then(response => response.json())
            .then(data => {
                calcResult.innerText = data.result;
                // Append history item
                const historyItem = document.createElement('li');
                historyItem.innerText = `${calculation} = ${data.result}`;
                historyList.appendChild(historyItem);
            })
            .catch(error => console.error(error));
        }

        // Show history function
        function showHistory() {
            homeSection.classList.add('hidden');
            historySection.classList.remove('hidden');
        }

        // Show home function
        function showHome() {
            historySection.classList.add('hidden');
            homeSection.classList.remove('hidden');
        }
    </script>
</body>
</html>
