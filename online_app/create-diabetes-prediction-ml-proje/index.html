<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Diabetes Prediction</h1>
        <form id="prediction-form">
            <div class="form-group">
                <label for="pregnancies">Pregnancies:</label>
                <input type="number" id="pregnancies" name="pregnancies" required>
            </div>
            <div class="form-group">
                <label for="glucose">Glucose:</label>
                <input type="number" id="glucose" name="glucose" required>
            </div>
            <div class="form-group">
                <label for="blood-pressure">Blood Pressure:</label>
                <input type="number" id="blood-pressure" name="blood-pressure" required>
            </div>
            <div class="form-group">
                <label for="skin-thickness">Skin Thickness:</label>
                <input type="number" id="skin-thickness" name="skin-thickness" required>
            </div>
            <div class="form-group">
                <label for="insulin">Insulin:</label>
                <input type="number" id="insulin" name="insulin" required>
            </div>
            <div class="form-group">
                <label for="bmi">BMI:</label>
                <input type="number" id="bmi" name="bmi" required>
            </div>
            <div class="form-group">
                <label for="diabetes-pedigree-function">Diabetes Pedigree Function:</label>
                <input type="number" id="diabetes-pedigree-function" name="diabetes-pedigree-function" required>
            </div>
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required>
            </div>
            <button type="submit" class="btn btn-primary">Predict</button>
        </form>
        <div id="prediction-result"></div>
        <canvas id="feature-importance-chart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#prediction-form').submit(function(e) {
                e.preventDefault();
                $.ajax({
                    type: 'POST',
                    url: '/predict',
                    data: JSON.stringify({
                        Pregnancies: $('#pregnancies').val(),
                        Glucose: $('#glucose').val(),
                        BloodPressure: $('#blood-pressure').val(),
                        SkinThickness: $('#skin-thickness').val(),
                        Insulin: $('#insulin').val(),
                        BMI: $('#bmi').val(),
                        DiabetesPedigreeFunction: $('#diabetes-pedigree-function').val(),
                        Age: $('#age').val()
                    }),
                    contentType: 'application/json',
                    success: function(data) {
                        $('#prediction-result').html('Prediction: ' + data.prediction + ', Probability: ' + data.probability);
                    }
                });
            });

            // Feature importance chart
            var ctx = document.getElementById('feature-importance-chart').getContext('2d');
            var chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Pregnancies', 'Glucose', 'Blood Pressure', 'Skin Thickness', 'Insulin', 'BMI', 'Diabetes Pedigree Function', 'Age'],
                    datasets: [{
                        label: 'Feature Importance',
                        data: [0.12, 0.23, 0.11, 0.15, 0.10, 0.08, 0.06, 0.15],
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
