<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Game</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.16/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/lucide-react@0.309.0/dist/umd/lucide-react.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { motion } = framerMotion;
    const { Home, Trophy, RefreshCw, ArrowUp, ArrowDown, ArrowLeft, ArrowRight } = lucideReact;

    const GameTile = ({ value }) => {
      const tileColors = {
        0: 'bg-slate-700',
        2: 'bg-amber-100 text-slate-900',
        4: 'bg-amber-200 text-slate-900',
        8: 'bg-amber-300 text-slate-900',
        16: 'bg-amber-400 text-slate-900',
        32: 'bg-amber-500',
        64: 'bg-amber-600',
        128: 'bg-amber-700',
        256: 'bg-amber-800',
        512: 'bg-amber-900',
        1024: 'bg-amber-950',
        2048: 'bg-gradient-to-r from-amber-500 to-pink-500'
      };

      return (
        <motion.div
          className={`w-20 h-20 flex items-center justify-center rounded-lg ${tileColors[value] || 'bg-slate-700'}`}
          initial={{ scale: 0 }}
          animate={{ scale: 1 }}
          transition={{ type: 'spring', stiffness: 300 }}
        >
          {value !== 0 && <span className="text-xl font-bold">{value}</span>}
        </motion.div>
      );
    };

    const GameGrid = () => {
      const grid = [
        [0, 2, 4, 8],
        [16, 32, 64, 128],
        [256, 512, 1024, 2048],
        [0, 0, 0, 0]
      ];

      return (
        <div className="grid grid-cols-4 gap-2 p-2 bg-slate-800 rounded-lg">
          {grid.flatMap((row, i) =>
            row.map((value, j) => (
              <GameTile key={`${i}-${j}`} value={value} />
            ))
          )}
        </div>
      );
    };

    const BottomNav = () => {
      const navItems = [
        { icon: Home, label: 'Home' },
        { icon: Trophy, label: 'Leaderboard' },
        { icon: RefreshCw, label: 'Restart' }
      ];

      return (
        <nav className="fixed bottom-0 left-0 right-0 bg-slate-800 p-2">
          <div className="flex justify-around">
            {navItems.map((item, i) => (
              <button key={i} className="flex flex-col items-center text-slate-300 hover:text-amber-400 transition-colors">
                <item.icon className="w-6 h-6" />
                <span className="text-xs">{item.label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    };

    const App = () => {
      return (
        <div className="w-full max-w-[420px]">
          <div className="flex flex-col items-center gap-4 mb-16">
            <h1 className="text-3xl font-bold text-amber-400">2048</h1>
            <div className="flex gap-4">
              <div className="bg-slate-800 p-2 rounded-lg">
                <span className="text-sm">Score</span>
                <p className="text-xl font-bold">2048</p>
              </div>
              <div className="bg-slate-800 p-2 rounded-lg">
                <span className="text-sm">Best</span>
                <p className="text-xl font-bold">4096</p>
              </div>
            </div>
            <GameGrid />
            <div className="grid grid-cols-3 gap-2 mt-4">
              <ArrowUp className="w-8 h-8 bg-slate-800 p-2 rounded-lg" />
              <ArrowDown className="w-8 h-8 bg-slate-800 p-2 rounded-lg" />
              <ArrowLeft className="w-8 h-8 bg-slate-800 p-2 rounded-lg" />
              <ArrowRight className="w-8 h-8 bg-slate-800 p-2 rounded-lg" />
            </div>
          </div>
          <BottomNav />
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
