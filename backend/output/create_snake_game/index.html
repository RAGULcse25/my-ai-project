<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <style>
        #game-container {
            width: 400px;
            height: 400px;
            border: 1px solid black;
            position: relative;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
        }
        #high-score {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score">Score: 0</div>
        <div id="high-score">High Score: 0</div>
        <canvas id="game-canvas" width="400" height="400"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDiv = document.getElementById('score');
        const highScoreDiv = document.getElementById('high-score');
        let snake = [{x: 200, y: 200}, {x: 190, y: 200}, {x: 180, y: 200}];
        let food = {x: Math.floor(Math.random() * 40) * 10, y: Math.floor(Math.random() * 40) * 10};
        let direction = 'right';
        let score = 0;
        let highScore = 0;
        let speed = 100;
        let intervalId;

        function drawSnake() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = 'green';
                ctx.fillRect(snake[i].x, snake[i].y, 10, 10);
            }
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x, food.y, 10, 10);
        }

        function updateSnake() {
            let head = snake[0];
            let newHead;
            switch (direction) {
                case 'right':
                    newHead = {x: head.x + 10, y: head.y};
                    break;
                case 'left':
                    newHead = {x: head.x - 10, y: head.y};
                    break;
                case 'up':
                    newHead = {x: head.x, y: head.y - 10};
                    break;
                case 'down':
                    newHead = {x: head.x, y: head.y + 10};
                    break;
            }
            snake.unshift(newHead);
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score++;
                scoreDiv.textContent = `Score: ${score}`;
                food = {x: Math.floor(Math.random() * 40) * 10, y: Math.floor(Math.random() * 40) * 10};
                speed *= 0.9;
            } else {
                snake.pop();
            }
            if (snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height || snake.slice(1).some(part => part.x === snake[0].x && part.y === snake[0].y)) {
                clearInterval(intervalId);
                if (score > highScore) {
                    highScore = score;
                    highScoreDiv.textContent = `High Score: ${highScore}`;
                }
                alert(`Game Over! Your score is ${score}.`);
                restartGame();
            }
        }

        function restartGame() {
            snake = [{x: 200, y: 200}, {x: 190, y: 200}, {x: 180, y: 200}];
            food = {x: Math.floor(Math.random() * 40) * 10, y: Math.floor(Math.random() * 40) * 10};
            direction = 'right';
            score = 0;
            scoreDiv.textContent = `Score: ${score}`;
            speed = 100;
            intervalId = setInterval(() => {
                updateSnake();
                drawSnake();
            }, speed);
        }

        document.addEventListener('keydown', event => {
            switch (event.key) {
                case 'ArrowRight':
                    if (direction !== 'left') {
                        direction = 'right';
                    }
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') {
                        direction = 'left';
                    }
                    break;
                case 'ArrowUp':
                    if (direction !== 'down') {
                        direction = 'up';
                    }
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') {
                        direction = 'down';
                    }
                    break;
            }
        });

        intervalId = setInterval(() => {
            updateSnake();
            drawSnake();
        }, speed);
    </script>
</body>
</html>
