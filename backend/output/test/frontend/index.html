```html
<!DOCTYPE html>
<html>
<head>
  <title>test</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f9; }
    .header { background: #333; color: white; padding: 1rem; text-align: center; }
    .container { margin: 2rem auto; width: 80%; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="header"><h1>test</h1></div>
  <div class="container" id="app">
    <!-- Dashboard content will be loaded here -->
  </div>
  <script>
    fetch('http://localhost:5000/data')
      .then(response => response.json())
      .then(data => {
        const appContainer = document.getElementById('app');
        appContainer.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      })
      .catch(error => {
        console.error('Error fetching data:', error);
      });
  </script>
</body>
</html>
