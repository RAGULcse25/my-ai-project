```html
<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <style>
    body { margin:0; background:#1a1a2e; color:white; font-family:Arial; }
    canvas { display:block; margin:auto; border:2px solid #00ff88; }
    #ui { text-align:center; padding:10px; }
    .btn { background:#00ff88; color:#000; border:none; 
           padding:10px 20px; cursor:pointer; border-radius:5px; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Snake Game</h1>
    <button class="btn" onclick="startGame()">START GAME</button>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 5, y: 5 };
    let direction = { x: 0, y: 0 };
    let score = 0;

    function startGame() {
      fetch('http://localhost:5000/start', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(response => response.json())
      .then(data => {
        snake = data.snake;
        food = data.food;
        direction = data.direction;
        score = data.score;
        gameLoop();
      });
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSnake();
      drawFood();
      updateSnake();
      setTimeout(gameLoop, 100);
    }

    function drawSnake() {
      ctx.fillStyle = '#00ff88';
      snake.forEach(part => {
        ctx.fillRect(part.x * 20, part.y * 20, 20, 20);
      });
    }

    function drawFood() {
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(food.x * 20, food.y * 20, 20, 20);
    }

    function updateSnake() {
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        fetch('http://localhost:5000/eat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ snake, food })
        })
        .then(response => response.json())
        .then(data => {
          food = data.food;
          score = data.score;
        });
      } else {
        snake.pop();
      }
    }

    window.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp': direction = { x: 0, y: -1 }; break;
        case 'ArrowDown': direction = { x: 0, y: 1 }; break;
        case 'ArrowLeft': direction = { x: -1, y: 0 }; break;
        case 'ArrowRight': direction = { x: 1, y: 0 }; break;
      }
    });
  </script>
</body>
</html>
