<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product Landing</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white text-gray-900 font-sans overflow-x-hidden">
<nav class="flex justify-between items-center p-6 max-w-7xl mx-auto">
  <div class="font-bold text-2xl tracking-tighter flex items-center gap-2"><i data-lucide="activity" class="text-rose-500"></i> Pulse<span class="text-gray-400">Fit</span></div>
  <div class="flex gap-4">
    <button class="text-gray-500 font-semibold hover:text-gray-900">Log in</button>
    <button class="bg-gray-900 text-white px-5 py-2 rounded-full font-semibold hover:bg-gray-800 shadow-lg">Download App</button>
  </div>
</nav>

<section class="max-w-7xl mx-auto px-6 py-20 grid md:grid-cols-2 gap-12 items-center min-h-[80vh]">
  <div>
    <div class="inline-block bg-rose-100 text-rose-600 font-bold px-3 py-1 rounded-full text-sm mb-6">#1 Fitness Tracker of 2026</div>
    <h1 class="text-6xl md:text-8xl font-black tracking-tighter leading-[0.9] mb-6">Master your <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-orange-400">metabolism.</span></h1>
    <p class="text-xl text-gray-500 mb-8 max-w-lg">Advanced AI-driven workouts, real-time biometric tracking, and personalized nutrition plans—all in your pocket.</p>
    <div class="flex gap-4">
      <button class="bg-gray-900 text-white px-8 py-4 rounded-full font-bold text-lg hover:shadow-xl hover:-translate-y-1 transition duration-300">Get on iOS</button>
      <button class="bg-white border border-gray-200 text-gray-900 px-8 py-4 rounded-full font-bold text-lg shadow-sm hover:bg-gray-50 transition">Get on Android</button>
    </div>
  </div>
  <div class="relative">
    <div class="absolute inset-0 bg-gradient-to-tr from-rose-200 to-orange-100 rounded-full blur-[100px] z-0"></div>
    <img src="https://images.unsplash.com/photo-1526502619053-900effea2ba7?w=800" class="relative z-10 w-full rounded-[40px] shadow-2xl rotate-3 hover:rotate-0 transition duration-500 border-8 border-white object-cover h-[600px]">
    
    <div class="absolute bottom-10 -left-10 bg-white p-4 rounded-2xl shadow-xl z-20 flex items-center gap-4 animate-bounce" style="animation-duration:3s">
      <div class="bg-green-100 p-3 rounded-full text-green-600"><i data-lucide="trending-up"></i></div>
      <div>
        <div class="text-sm text-gray-500 font-semibold">Calories Burned</div>
        <div class="text-xl font-bold">1,248 kcal</div>
      </div>
    </div>
  </div>
</section>

<script>lucide.createIcons();</script>
</body>
</html>
