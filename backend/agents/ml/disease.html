<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Disease Predictor</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans p-8">
  <div class="max-w-5xl mx-auto flex gap-8">
    <div class="w-1/3 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 object-cover relative overflow-hidden">
      <div class="absolute inset-0 bg-blue-50"></div>
      <div class="relative z-10">
        <h2 class="font-bold text-blue-900 text-xl mb-6">Patient Biometrics</h2>
        <div class="space-y-4">
          <div><label class="text-xs font-bold text-slate-500 uppercase">Glucose Level</label><input type="range" class="w-full accent-blue-600"></div>
          <div><label class="text-xs font-bold text-slate-500 uppercase">Blood Pressure</label><input type="range" class="w-full accent-blue-600"></div>
          <div><label class="text-xs font-bold text-slate-500 uppercase">Skin Thickness</label><input type="range" class="w-full accent-blue-600"></div>
          <div><label class="text-xs font-bold text-slate-500 uppercase">Insulin</label><input type="range" class="w-full accent-blue-600"></div>
          <div><label class="text-xs font-bold text-slate-500 uppercase">BMI</label><input type="range" class="w-full accent-blue-600"></div>
          <div><label class="text-xs font-bold text-slate-500 uppercase">Age</label><input type="range" class="w-full accent-blue-600"></div>
        </div>
        <button class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl mt-8 shadow-lg shadow-blue-200">Run Inference</button>
      </div>
    </div>
    
    <div class="w-2/3 space-y-6">
      <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-8">
        <div class="flex-1">
          <div class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">SVM Classification</div>
          <h1 class="text-4xl font-black text-slate-800">Diabetes Onset</h1>
        </div>
        <div class="bg-red-50 text-red-600 border px-6 py-4 border-red-100 rounded-2xl text-center">
          <div class="text-xs font-bold uppercase mb-1">Risk Assessment</div>
          <div class="text-3xl font-black">HIGH RISK</div>
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
          <h3 class="font-bold text-slate-700 mb-4">Probability Calibrator</h3>
          <div class="flex items-center gap-4">
            <div class="w-32 h-32 rounded-full border-8 border-red-500 flex items-center justify-center text-3xl font-black text-slate-800">82%</div>
            <p class="text-sm text-slate-500">Model predicts an 82% likelihood of positive diagnosis based on PIMA Indian historical data.</p>
          </div>
        </div>
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
          <h3 class="font-bold text-slate-700 mb-4">Support Vector Margins</h3>
          <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=400" class="w-full h-32 object-cover rounded-xl filter grayscale contrast-125 mix-blend-multiply opacity-50">
        </div>
      </div>
    </div>
  </div>
<script>lucide.createIcons();</script>
</body>
</html>
