<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Snake — S.E.A.D.S.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070B14;color:#FFF;font-family:'Outfit',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;
  background-image:radial-gradient(circle at 10% 20%,rgba(78,205,230,0.1),transparent 40%);}
h1{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#4ECDE6,#6C63FF);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;}
.ui{display:flex;justify-content:space-between;width:400px;font-size:1.2rem;margin-bottom:10px;font-weight:700;}
canvas{background:rgba(255,255,255,0.03);border:2px solid rgba(78,205,230,0.3);border-radius:12px;
  box-shadow:0 0 30px rgba(78,205,230,0.15);}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;display:none;z-index:10;}
.overlay.show{display:flex;}
button{padding:12px 24px;border:none;border-radius:8px;font-size:1.1rem;font-weight:700;
  background:linear-gradient(135deg,#4ECDE6,#6C63FF);color:#FFF;cursor:pointer;
  box-shadow:0 10px 20px rgba(108,99,255,0.4);transition:all .2s;}
button:hover{transform:translateY(-2px);box-shadow:0 15px 25px rgba(108,99,255,0.6);}
</style>
</head>
<body>
  <h1>Neon Snake</h1>
  <div class="ui">
    <span>Score: <span id="score">0</span></span>
    <span>Top: <span id="high">0</span></span>
  </div>
  <div style="position:relative;width:400px;height:400px;">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="startMenu" class="overlay show">
      <h2 style="margin-bottom:20px;">Ready?</h2>
      <button onclick="startGame()">Start Game</button>
    </div>
    <div id="gameOver" class="overlay">
      <h2 style="margin-bottom:10px;color:#FF4444;">Game Over!</h2>
      <p style="margin-bottom:20px;color:#AAA;">You crashed.</p>
      <button onclick="startGame()">Play Again</button>
    </div>
  </div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const S = 20;
let snake = [];
let food = {};
let dx = S, dy = 0;
let score = 0, high = localStorage.getItem('snakeHigh') || 0;
let state = 'menu';
let lastTime=0, speed=120, acc=0;

document.getElementById('high').textContent = high;

function startGame(){
  snake = [
    {x:160,y:200},{x:140,y:200},{x:120,y:200}
  ];
  dx=S; dy=0; score=0; speed=120;
  spawnFood();
  document.getElementById('score').textContent = score;
  document.getElementById('startMenu').classList.remove('show');
  document.getElementById('gameOver').classList.remove('show');
  state = 'playing';
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function spawnFood(){
  food.x = Math.floor(Math.random()*(canvas.width/S))*S;
  food.y = Math.floor(Math.random()*(canvas.height/S))*S;
  if(snake.some(s => s.x===food.x && s.y===food.y)) spawnFood();
}

document.addEventListener('keydown', e => {
  if(state!=='playing') return;
  if(e.key==='ArrowUp' && dy===0){dx=0;dy=-S;}
  if(e.key==='ArrowDown' && dy===0){dx=0;dy=S;}
  if(e.key==='ArrowLeft' && dx===0){dx=-S;dy=0;}
  if(e.key==='ArrowRight' && dx===0){dx=S;dy=0;}
});

function loop(t){
  if(state!=='playing') return;
  requestAnimationFrame(loop);
  acc += t - lastTime;
  lastTime = t;
  if(acc > speed){
    update();
    acc = 0;
  }
}

function update(){
  const head = {x:snake[0].x+dx, y:snake[0].y+dy};
  
  // Wall collision
  if(head.x<0 || head.x>=canvas.width || head.y<0 || head.y>=canvas.height) return over();
  // Self collision
  if(snake.some(s => s.x===head.x && s.y===head.y)) return over();

  snake.unshift(head);

  // Food
  if(head.x===food.x && head.y===food.y){
    score+=10;
    if(score>high) { high=score; localStorage.setItem('snakeHigh',high); }
    document.getElementById('score').textContent=score;
    document.getElementById('high').textContent=high;
    speed = Math.max(50, speed-2); // faster
    spawnFood();
  } else {
    snake.pop();
  }
  draw();
}

function over(){
  state = 'over';
  document.getElementById('gameOver').classList.add('show');
}

function draw(){
  ctx.fillStyle='rgba(7,11,20, 1)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.shadowBlur = 10;
  ctx.fillStyle='#4ECDE6';
  ctx.shadowColor='#4ECDE6';
  snake.forEach(p => ctx.fillRect(p.x,p.y,S-1,S-1));
  
  ctx.fillStyle='#FF6B9D';
  ctx.shadowColor='#FF6B9D';
  ctx.fillRect(food.x,food.y,S-1,S-1);
  ctx.shadowBlur = 0;
}
draw();
</script>
</body>
</html>
