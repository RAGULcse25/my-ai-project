<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fashion Boutique</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0;} body{background:#fafaf8;color:#1a1a1a; font-family:'Inter',sans-serif;}</style>
</head>
<body>
<nav class="sticky top-0 z-50 bg-[#fafaf8]/90 backdrop-blur border-b border-gray-200 px-8 py-4 flex items-center justify-between">
  <div class="text-3xl font-semibold italic tracking-widest" style="font-family:'Cormorant Garamond',serif;">MAISON</div>
  <div class="hidden md:flex gap-8 text-xs tracking-[0.2em] uppercase text-gray-600 font-medium">
    <a href="#" class="hover:text-black transition">New In</a><a href="#" class="hover:text-black transition">Women</a><a href="#" class="hover:text-black transition">Dresses</a><a href="#" class="hover:text-black transition">Accessories</a>
  </div>
  <div class="flex items-center gap-5 text-gray-600">
    <i data-lucide="search" class="w-5 h-5 cursor-pointer hover:text-black"></i>
    <div class="relative cursor-pointer"><i data-lucide="shopping-bag" class="w-5 h-5 hover:text-black"></i><span class="absolute -top-1 -right-2 bg-black text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center">2</span></div>
  </div>
</nav>

<!-- Hero -->
<section class="grid md:grid-cols-2 h-[90vh]">
  <div class="relative overflow-hidden">
    <img src="https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=900&auto=format" class="w-full h-full object-cover hover:scale-105 transition duration-700">
  </div>
  <div class="bg-[#f0ebe3] flex flex-col justify-center px-16">
    <p class="text-xs tracking-[0.3em] uppercase text-gray-500 mb-4">New Collection 2026</p>
    <h1 class="text-6xl font-light leading-tight mb-8" style="font-family:'Cormorant Garamond',serif;">The Art of <br><em>Effortless</em><br>Dressing.</h1>
    <button class="border border-black px-10 py-3 text-sm tracking-widest uppercase hover:bg-black hover:text-white transition duration-300 w-fit">Explore Collection</button>
  </div>
</section>

<!-- Products -->
<section class="max-w-7xl mx-auto px-8 py-20">
  <h2 class="text-4xl font-light mb-12 text-center" style="font-family:'Cormorant Garamond',serif;">Curated For You</h2>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
    <div class="group cursor-pointer">
      <div class="overflow-hidden bg-gray-100 mb-3 relative">
        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500&auto=format" class="w-full h-72 object-cover group-hover:scale-105 transition duration-500">
        <div class="absolute bottom-0 left-0 right-0 bg-white/90 backdrop-blur p-3 translate-y-full group-hover:translate-y-0 transition duration-300 flex gap-2">
          <button class="flex-1 text-xs tracking-widest border border-black py-2 hover:bg-black hover:text-white transition text-center">XS</button>
          <button class="flex-1 text-xs tracking-widest border border-black py-2 hover:bg-black hover:text-white transition text-center">S</button>
          <button class="flex-1 text-xs tracking-widest border border-black py-2 hover:bg-black hover:text-white transition text-center">M</button>
          <button class="flex-1 text-xs tracking-widest border border-black py-2 hover:bg-black hover:text-white transition text-center">L</button>
        </div>
      </div>
      <p class="text-sm font-medium">Silk Wrap Midi Dress</p>
      <p class="text-sm text-gray-500 mt-1">₹12,499</p>
    </div>
    <div class="group cursor-pointer">
      <div class="overflow-hidden bg-gray-100 mb-3">
        <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=500&auto=format" class="w-full h-72 object-cover group-hover:scale-105 transition duration-500">
      </div>
      <p class="text-sm font-medium">Linen Blazer Set</p>
      <p class="text-sm text-gray-500 mt-1">₹8,995</p>
    </div>
    <div class="group cursor-pointer">
      <div class="overflow-hidden bg-gray-100 mb-3">
        <img src="https://images.unsplash.com/photo-1445205170230-053b83016050?w=500&auto=format" class="w-full h-72 object-cover group-hover:scale-105 transition duration-500">
      </div>
      <p class="text-sm font-medium">Floral Chiffon Kurti</p>
      <p class="text-sm text-gray-500 mt-1">₹3,250</p>
    </div>
    <div class="group cursor-pointer">
      <div class="overflow-hidden bg-gray-100 mb-3">
        <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=500&auto=format" class="w-full h-72 object-cover group-hover:scale-105 transition duration-500">
      </div>
      <p class="text-sm font-medium">Wide-Leg Trousers</p>
      <p class="text-sm text-gray-500 mt-1">₹5,499</p>
    </div>
  </div>
</section>
<script>lucide.createIcons();</script>
</body>
</html>
