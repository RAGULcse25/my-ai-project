<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quiz App</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>body{background:#0f172a; color:white; font-family:sans-serif;} .option{background:#1e293b;border:2px solid #334155;transition:all 0.2s;} .option:hover{border-color:#3b82f6;background:#1e3a8a;} .correct{border-color:#10b981;background:#064e3b;} .wrong{border-color:#ef4444;background:#7f1d1d;}</style>
</head>
<body class="h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-2xl bg-slate-800 rounded-3xl overflow-hidden shadow-2xl border border-slate-700">
    <!-- Header -->
    <div class="flex justify-between items-center p-6 border-b border-slate-700 bg-slate-900">
      <div class="font-bold text-slate-300">Question 4 / 10</div>
      <div class="flex items-center gap-2 bg-slate-800 px-4 py-1.5 rounded-full text-rose-500 font-mono font-bold border border-rose-900 animate-pulse"><i data-lucide="timer" class="w-4 h-4"></i> 00:14</div>
      <div class="font-bold text-emerald-400">Score: 300</div>
    </div>
    <!-- Body -->
    <div class="p-8">
      <div class="w-full bg-slate-700 h-2 rounded-full mb-8 overflow-hidden"><div class="bg-blue-500 h-full w-[40%]"></div></div>
      <h2 class="text-3xl font-bold mb-8 leading-snug">Which programming language was created by James Gosling at Sun Microsystems?</h2>
      <div class="space-y-4">
        <button class="option w-full p-4 rounded-xl text-left text-lg font-medium flex items-center gap-4"><div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold">A</div> Python</button>
        <button class="option w-full p-4 rounded-xl text-left text-lg font-medium flex items-center gap-4 correct"><div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center font-bold">B</div> Java <i data-lucide="check-circle" class="ml-auto text-emerald-400"></i></button>
        <button class="option w-full p-4 rounded-xl text-left text-lg font-medium flex items-center gap-4"><div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold">C</div> C++</button>
        <button class="option w-full p-4 rounded-xl text-left text-lg font-medium flex items-center gap-4"><div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold">D</div> JavaScript</button>
      </div>
    </div>
    <!-- Footer -->
    <div class="p-6 bg-slate-900 border-t border-slate-700 flex justify-between items-center">
      <div class="text-emerald-400 font-bold flex items-center gap-2"><i data-lucide="zap"></i> +100 Points!</div>
      <button class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-xl transition shadow-lg flex items-center gap-2">Next Question <i data-lucide="arrow-right" class="w-5 h-5"></i></button>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
