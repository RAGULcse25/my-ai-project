<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Text Effects</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Righteous&display=swap');
.neon-text{
  font-family:'Righteous',cursive;
  color:#fff;
  text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #0ff;
}
</style>
</head>
<body class="bg-gray-900 flex font-sans h-screen">
  <div class="w-80 bg-gray-800 border-r border-gray-700 p-6 flex flex-col z-10 text-white">
    <div class="font-bold text-xl mb-8 flex items-center gap-2"><i data-lucide="type" class="text-cyan-400"></i> TypeCraft</div>
    
    <label class="text-xs font-bold text-gray-400 mb-2 uppercase">Your Text</label>
    <textarea class="w-full bg-gray-900 border border-gray-600 rounded p-3 mb-6 font-mono text-cyan-400 outline-none focus:border-cyan-400">CYBER 
PUNK</textarea>
    
    <label class="text-xs font-bold text-gray-400 mb-2 uppercase">Presets</label>
    <div class="grid grid-cols-2 gap-2 mb-6">
      <button class="bg-gray-700 hover:bg-gray-600 py-2 rounded text-sm text-center border-l-4 border-cyan-400 transition font-bold tracking-widest text-cyan-200">NEON</button>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 rounded text-sm text-center font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-orange-400">Gradient</button>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 rounded text-sm text-center font-bold text-white shadow-[0_4px_0_#94a3b8] active:shadow-[0_0px_0_#94a3b8] active:translate-y-1 transition-all">3D Block</button>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 rounded text-sm text-center font-serif italic text-white blur-[0.5px]">Ghost</button>
    </div>
  </div>
  
  <div class="flex-1 bg-[url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=1600')] bg-cover bg-center flex items-center justify-center">
    <div class="absolute inset-0 bg-gray-900/80 backdrop-blur-sm"></div>
    <div class="relative z-10 text-center">
      <h1 class="text-8xl md:text-[180px] leading-none neon-text uppercase text-center" style="white-space: pre-wrap;">CYBER
PUNK</h1>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
