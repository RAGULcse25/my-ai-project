<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BG Remover</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>
.checker{background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0px;}
</style>
</head>
<body class="bg-gray-100 flex flex-col h-screen font-sans">
  <nav class="bg-white px-6 py-4 border-b flex justify-between items-center shadow-sm">
    <div class="font-bold text-xl flex items-center gap-2"><i data-lucide="scissors" class="text-rose-500"></i> CutOut AI</div>
    <button class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-md hover:bg-blue-700">Download High-Res</button>
  </nav>
  
  <div class="flex-1 flex p-6 gap-6">
    <div class="flex-1 bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col overflow-hidden relative">
      <div class="p-4 border-b bg-gray-50 flex justify-between items-center z-10">
        <h2 class="font-bold text-gray-700">Original</h2>
      </div>
      <div class="flex-1 bg-gray-200 flex items-center justify-center p-4">
        <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600" class="max-h-full object-contain rounded drop-shadow-xl" id="orig">
      </div>
    </div>
    
    <div class="flex flex-col justify-center items-center">
      <button class="bg-blue-600 text-white p-4 rounded-full shadow-lg hover:scale-110 transition"><i data-lucide="arrow-right"></i></button>
    </div>
    
    <div class="flex-1 bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col overflow-hidden relative">
      <div class="p-4 border-b bg-gray-50 flex justify-between items-center z-10">
        <h2 class="font-bold text-gray-700">Removed Background</h2>
        <div class="flex gap-2">
          <button class="w-6 h-6 rounded-full border checker shadow-inner"></button>
          <button class="w-6 h-6 rounded-full bg-white border border-gray-300 shadow-inner"></button>
          <button class="w-6 h-6 rounded-full bg-black border shadow-inner"></button>
          <button class="w-6 h-6 rounded-full bg-blue-500 border shadow-inner"></button>
        </div>
      </div>
      <div class="flex-1 checker flex items-center justify-center p-4 relative overflow-hidden group">
        <!-- We simulate removed background by dropping out the surrounding color. Real app uses transparent PNG -->
        <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600" class="max-h-full object-contain filter drop-shadow-2xl" id="res" style="-webkit-mask-image: radial-gradient(circle at 50% 40%, black 30%, transparent 60%);">
        
        <div class="absolute inset-0 bg-blue-600/10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
          <div class="bg-white px-6 py-3 rounded-full font-bold shadow-xl flex items-center gap-2 cursor-pointer hover:bg-gray-50 text-blue-600"><i data-lucide="edit-3" class="w-4 h-4"></i> Edit Erase/Restore</div>
        </div>
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
