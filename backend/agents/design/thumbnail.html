<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Thumbnail Maker</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-900 text-white flex flex-col h-screen font-sans">
  <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950">
    <div class="font-bold text-red-500 flex items-center gap-2"><i data-lucide="youtube"></i> YT ThumbGen</div>
    <button class="bg-red-600 text-white px-6 py-2 rounded font-bold hover:bg-red-500">Export 1280x720</button>
  </div>
  <div class="flex-1 flex items-center justify-center p-8 relative">
    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=1600')] bg-cover opacity-10 blur-sm"></div>
    <div class="w-[800px] h-[450px] bg-black shadow-2xl relative border-4 border-zinc-800 overflow-hidden group">
      <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=1280" class="absolute w-full h-full object-cover opacity-70 group-hover:scale-105 transition duration-700">
      <div class="absolute inset-0 bg-gradient-to-r from-pink-600/60 to-purple-800/60 mix-blend-color"></div>
      
      <div class="absolute top-10 left-10 transform -rotate-3 bg-yellow-400 text-black px-6 py-2 font-black text-4xl shadow-xl uppercase border-4 border-black">Hidden Secrets</div>
      <div class="absolute top-24 left-16 transform -rotate-3 bg-white text-black px-6 py-2 font-black text-6xl shadow-xl uppercase border-4 border-black">Exposed! 😱</div>
      
      <div class="absolute bottom-6 right-6 border-4 border-white rounded overflow-hidden shadow-2xl shadow-yellow-400">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200" class="w-32 h-32 object-cover">
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
