<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Guessing App</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-600 text-white flex flex-col h-screen justify-center items-center px-6">
  <div class="bg-white/10 p-8 rounded-3xl backdrop-blur-md w-full max-w-sm text-center border border-white/20">
    <h1 class="text-3xl font-black mb-2">Guess!</h1>
    <p class="text-indigo-200 mb-6 text-sm">Pick a number between 1 and 100</p>
    <div id="output" class="text-xl font-bold h-12 mb-4 text-yellow-300">Start guessing...</div>
    <input type="number" id="guess" class="w-full bg-white/20 border-2 border-white/30 rounded-full py-4 text-center text-2xl outline-none font-bold mb-4 placeholder-white/50 focus:border-white transition" placeholder="Enter number">
    <button onclick="check()" class="w-full bg-white text-indigo-600 py-4 rounded-full font-bold text-lg hover:bg-gray-100 shadow-lg transition">Submit</button>
  </div>
<script>
let target = Math.floor(Math.random()*100)+1;
let attempts = 0;
function check(){
  let g = parseInt(document.getElementById('guess').value);
  if(isNaN(g)) return;
  attempts++;
  let o = document.getElementById('output');
  if(g<target) o.innerText="Too Low! ⬆";
  else if(g>target) o.innerText="Too High! ⬇";
  else {
    o.innerText=`🎉 Correct! (${attempts} tries)`;
    target = Math.floor(Math.random()*100)+1;
    attempts = 0;
    setTimeout(()=> o.innerText="Ready for a new game...", 3000);
  }
}
</script>
</body>
</html>
