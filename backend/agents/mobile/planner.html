<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Study Planner</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#FFF8F0] font-sans h-screen flex flex-col shadow-inner">
  <div class="bg-[#FF9F1C] text-white pt-16 pb-20 px-6 rounded-b-[40px] relative">
    <h1 class="text-3xl font-black tracking-tight mb-2">My Timetable</h1>
    <p class="text-orange-100 font-medium opacity-90">Thursday, 12 Oct</p>
    
    <div class="flex justify-between mt-8 text-center text-sm font-bold">
      <div class="opacity-50">T<br>10</div>
      <div class="opacity-50">W<br>11</div>
      <div class="bg-white text-orange-500 w-10 h-14 rounded-full flex items-center justify-center shadow-lg transform scale-110">T<br>12</div>
      <div class="opacity-50">F<br>13</div>
      <div class="opacity-50">S<br>14</div>
    </div>
  </div>
  
  <div class="flex-1 px-6 -mt-10 overflow-y-auto space-y-4 pb-10">
    <div class="bg-white p-5 rounded-3xl shadow-sm border border-orange-50 relative flex gap-4">
      <div class="bg-blue-100 text-blue-600 px-3 py-2 rounded-2xl font-bold flex flex-col justify-center text-center">09<span class="text-xs font-normal">AM</span></div>
      <div>
        <h3 class="font-bold text-gray-800 text-lg">Applied Physics</h3>
        <p class="text-gray-400 text-xs font-medium flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> Room 302</p>
      </div>
    </div>
    
    <div class="bg-gray-800 text-white p-5 rounded-3xl shadow-lg relative flex gap-4 shadow-gray-400">
      <div class="bg-white/20 text-white px-3 py-2 rounded-2xl font-bold flex flex-col justify-center text-center">11<span class="text-xs font-normal">AM</span></div>
      <div>
        <h3 class="font-bold text-white text-lg">Computer Science</h3>
        <p class="text-gray-300 text-xs font-medium flex items-center gap-1"><i data-lucide="book" class="w-3 h-3"></i> Chapter 4: Data Structs</p>
      </div>
    </div>
    
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
