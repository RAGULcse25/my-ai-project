<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quiz App</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#2D1B69] text-white h-screen flex flex-col p-6">
  <div class="flex justify-between items-center mb-8 pt-8">
    <div class="text-sm font-bold text-pink-400">Question 1/5</div>
    <div class="bg-pink-500/20 text-pink-400 px-3 py-1 rounded-full font-bold">Score: 0</div>
  </div>
  
  <h2 class="text-3xl font-black mb-10 leading-tight">What does "HTML" stand for?</h2>
  
  <div class="space-y-4">
    <button class="w-full bg-white/10 p-5 rounded-2xl text-left font-semibold border-2 border-transparent hover:border-pink-500 hover:bg-white/20 transition active:scale-95">Hyper Text Markup Language</button>
    <button class="w-full bg-white/10 p-5 rounded-2xl text-left font-semibold border-2 border-transparent hover:border-pink-500 hover:bg-white/20 transition active:scale-95">High Tech Modern Language</button>
    <button class="w-full bg-white/10 p-5 rounded-2xl text-left font-semibold border-2 border-transparent hover:border-pink-500 hover:bg-white/20 transition active:scale-95">Hyperlink Text Machine Logic</button>
  </div>
  
  <button class="mt-auto bg-pink-500 w-full py-4 rounded-full font-bold text-lg shadow-[0_10px_20px_rgba(236,72,153,0.4)] mb-4">Next Question</button>
</body>
</html>
